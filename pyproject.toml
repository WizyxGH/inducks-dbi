[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inducks-dbi"
version = "0.1.0"
description = "Inducks .dbi index lines (Bolderbast columns) and story rules from the Inducks ISV dump"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
covers = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
